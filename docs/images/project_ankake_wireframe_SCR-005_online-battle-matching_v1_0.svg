<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Project Ankake オンライン対戦準備・マッチング画面ワイヤーフレーム</title>
  <desc id="desc">表示名、合言葉、CPU対戦準備画面と共通の使用デッキプルダウン、マッチング開始ボタンを配置したオンライン対戦準備画面。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171d31"/></linearGradient><linearGradient id="primary" x2="1" y2="1"><stop stop-color="#7b5cff"/><stop offset="1" stop-color="#278bc0"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/></filter></defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><path d="M0 230H1920M0 540H1920M0 850H1920" stroke="#b6c8ef" opacity=".06" stroke-width="2"/>
  <text x="160" y="115" fill="#dce7ff" font-family="sans-serif" font-size="28">‹ メニューへ戻る</text><text x="960" y="125" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700" font-size="44">オンライン対戦</text>
  <g filter="url(#s)"><rect x="475" y="185" width="970" height="750" rx="36" fill="#121b31" stroke="#7890bf" stroke-opacity=".4" stroke-width="2"/></g>
  <g font-family="sans-serif"><text x="585" y="280" fill="#dbe7ff" font-size="26" font-weight="700">表示名</text><text x="585" y="315" fill="#aab9d7" font-size="18">対戦中に相手へ表示されます。重複していても対戦できます。</text><rect x="585" y="340" width="750" height="72" rx="12" fill="#0a1120" stroke="#6e83ad"/><text x="615" y="385" fill="#7282a0" font-size="22">ユーザー名を入力</text>
  <text x="585" y="490" fill="#dbe7ff" font-size="26" font-weight="700">合言葉 <tspan fill="#9eacc8" font-size="18">（任意）</tspan></text><rect x="585" y="520" width="750" height="72" rx="12" fill="#0a1120" stroke="#6e83ad"/><text x="615" y="565" fill="#7282a0" font-size="22">同じ合言葉の相手とのみ対戦</text><text x="585" y="630" fill="#aab9d7" font-size="19">未入力の場合は、ランダムマッチになります</text>
  <text x="585" y="705" fill="#dbe7ff" font-size="26" font-weight="700">使用デッキ</text><rect x="585" y="725" width="750" height="72" rx="12" fill="#0a1120" stroke="#6e83ad"/><text x="615" y="770" fill="#7282a0" font-size="22">デッキを選択</text><path d="M1280 752l18 18 18-18" fill="none" stroke="#dbe7ff" stroke-width="4"/>
  <text x="585" y="840" fill="#9fafd0" font-size="19">状態：ユーザー名とデッキを設定してください</text><rect x="900" y="860" width="435" height="72" rx="18" fill="url(#primary)"/><text x="1118" y="906" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">マッチングを開始</text></g>
  <text x="1810" y="1030" text-anchor="end" fill="#8291ad" font-family="sans-serif" font-size="18">SCR-005</text>
</svg>
