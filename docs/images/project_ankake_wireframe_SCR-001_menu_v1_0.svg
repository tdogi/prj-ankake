<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Project Ankake メニュー画面ワイヤーフレーム</title>
  <desc id="desc">上部に正式ロゴ、中央にCPU対戦、オンライン対戦、デッキ構築のボタン、背景に三つのレーンと拠点を抽象化した戦場を配置したメニュー画面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="52%" stop-color="#171d31"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18213a" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0e1526" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b5cff"/>
      <stop offset="55%" stop-color="#5456d8"/>
      <stop offset="100%" stop-color="#278bc0"/>
    </linearGradient>
    <linearGradient id="secondary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#293752"/>
      <stop offset="100%" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9d4ff"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ee9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#9fb1dd" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- AREA-001: 背景領域 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="260" cy="230" r="360" fill="#5940d6" opacity="0.16"/>
  <circle cx="1670" cy="260" r="410" fill="#187ea8" opacity="0.14"/>
  <ellipse cx="960" cy="1040" rx="680" ry="260" fill="#5138a4" opacity="0.10"/>

  <!-- 背景イラスト: 三レーンと拠点を抽象化した戦場 -->
  <g id="BG-ILLUSTRATION" transform="translate(240 350)" opacity="0.28">
    <path d="M80 470 C330 380 520 380 720 470 C920 560 1110 560 1360 470" fill="none" stroke="#88a4d5" stroke-width="42" stroke-linecap="round" opacity="0.24"/>
    <path d="M80 300 C330 215 520 215 720 300 C920 385 1110 385 1360 300" fill="none" stroke="#88a4d5" stroke-width="42" stroke-linecap="round" opacity="0.24"/>
    <path d="M80 130 C330 45 520 45 720 130 C920 215 1110 215 1360 130" fill="none" stroke="#88a4d5" stroke-width="42" stroke-linecap="round" opacity="0.24"/>
    <g fill="#9ee9ff" stroke="#d9f5ff" stroke-width="6">
      <circle cx="420" cy="130" r="34"/><circle cx="720" cy="300" r="42"/><circle cx="1020" cy="470" r="34"/>
    </g>
    <g fill="#6653d8" stroke="#d8d1ff" stroke-width="6">
      <path d="M50 80 L96 42 L142 80 L132 150 L60 150 Z"/>
      <path d="M1298 420 L1344 382 L1390 420 L1380 490 L1308 490 Z"/>
    </g>
  </g>

  <!-- AREA-002: 正式ロゴ領域 -->
  <g id="IMG-001" transform="translate(960 116)" text-anchor="middle">
    <!-- ロゴマーク: 三レーンと三拠点 -->
    <g transform="translate(-250 -18)" filter="url(#softGlow)">
      <path d="M0 20 L54 -12 L108 20 L108 82 L54 114 L0 82 Z" fill="#11182a" stroke="#b9c3ff" stroke-width="4"/>
      <path d="M22 24 H86 M22 51 H86 M22 78 H86" stroke="#8a75ff" stroke-width="8" stroke-linecap="round"/>
      <circle cx="32" cy="24" r="7" fill="#ffffff"/>
      <circle cx="54" cy="51" r="7" fill="#bff3ff"/>
      <circle cx="76" cy="78" r="7" fill="#ffffff"/>
    </g>
    <text x="10" y="25" fill="#aab7d1" font-family="Noto Sans CJK JP, sans-serif" font-size="26" font-weight="600" letter-spacing="8">PROJECT</text>
    <text x="72" y="102" fill="url(#logo)" font-family="Noto Sans CJK JP, sans-serif" font-size="92" font-weight="800" letter-spacing="7">ANKAKE</text>
    <path d="M-102 128 H310" stroke="#7f8eb7" stroke-opacity="0.65" stroke-width="2"/>
    <text x="104" y="160" fill="#96a5c1" font-family="Noto Sans CJK JP, sans-serif" font-size="20" letter-spacing="5">THREE LANES. ONE FRONTLINE.</text>
  </g>

  <!-- AREA-003: メニュー領域 -->
  <g filter="url(#shadow)">
    <rect x="500" y="350" width="920" height="570" rx="42" fill="url(#panel)"/>
    <rect x="500" y="350" width="920" height="570" rx="42" fill="none" stroke="#93a5d2" stroke-opacity="0.28" stroke-width="2"/>
  </g>

  <!-- BTN-001: CPU対戦 -->
  <g id="BTN-001" filter="url(#shadow)">
    <rect x="610" y="574" width="700" height="140" rx="30" fill="url(#primary)"/>
    <rect x="610" y="574" width="700" height="140" rx="30" fill="none" stroke="#e7e6ff" stroke-opacity="0.48" stroke-width="2"/>
    <circle cx="703" cy="644" r="50" fill="#ffffff" opacity="0.13"/>
    <!-- 正式アイコン: 剣＋CPU回路 -->
    <g transform="translate(672 613)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 57 L54 9 L62 17 L14 65 Z"/>
      <path d="M42 8 L63 6 L61 27"/>
      <path d="M5 48 L22 65"/>
      <rect x="39" y="39" width="30" height="30" rx="7"/>
      <path d="M47 34 V27 M60 34 V27 M47 81 V74 M60 81 V74 M34 47 H27 M34 60 H27 M81 47 H74 M81 60 H74"/>
      <circle cx="49" cy="50" r="2" fill="#ffffff" stroke="none"/><circle cx="60" cy="50" r="2" fill="#ffffff" stroke="none"/>
    </g>
    <text x="790" y="637" fill="#ffffff" font-family="Noto Sans CJK JP, sans-serif" font-size="42" font-weight="700">CPU対戦</text>
    <text x="790" y="680" fill="#e3eaff" font-family="Noto Sans CJK JP, sans-serif" font-size="22">デッキを選択して対戦を開始</text>
  </g>

  <!-- BTN-003: オンライン対戦 -->
  <g id="BTN-003" filter="url(#shadow)">
    <rect x="610" y="404" width="700" height="132" rx="28" fill="url(#primary)"/>
    <rect x="610" y="404" width="700" height="132" rx="28" fill="none" stroke="#e7e6ff" stroke-opacity="0.48" stroke-width="2"/>
    <circle cx="703" cy="470" r="46" fill="#ffffff" opacity="0.13"/>
    <g transform="translate(672 436)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="23" cy="20" r="12"/><circle cx="62" cy="20" r="12"/>
      <path d="M4 62 C6 43 39 43 42 62 M43 62 C46 43 79 43 81 62"/>
      <path d="M31 28 H54" stroke="#bff3ff"/>
    </g>
    <text x="790" y="463" fill="#ffffff" font-family="Noto Sans CJK JP, sans-serif" font-size="38" font-weight="700">オンライン対戦</text>
    <text x="790" y="502" fill="#e3eaff" font-family="Noto Sans CJK JP, sans-serif" font-size="21">ほかのプレイヤーと対戦</text>
  </g>

  <!-- BTN-002: デッキ構築 -->
  <g id="BTN-002" filter="url(#shadow)">
    <rect x="610" y="748" width="700" height="132" rx="28" fill="url(#secondary)"/>
    <rect x="610" y="748" width="700" height="132" rx="28" fill="none" stroke="#9daed3" stroke-opacity="0.38" stroke-width="2"/>
    <circle cx="703" cy="814" r="46" fill="#ffffff" opacity="0.08"/>
    <!-- 正式アイコン: 重なったカード -->
    <g transform="translate(670 777)" fill="none" stroke="#e8efff" stroke-width="5" stroke-linejoin="round">
      <rect x="8" y="6" width="54" height="72" rx="8" transform="rotate(-9 35 42)"/>
      <rect x="24" y="8" width="54" height="72" rx="8" fill="#26344f"/>
      <rect x="34" y="19" width="34" height="29" rx="5"/>
      <path d="M35 59 H65 M35 68 H58"/>
    </g>
    <text x="790" y="807" fill="#f4f7ff" font-family="Noto Sans CJK JP, sans-serif" font-size="38" font-weight="700">デッキ構築</text>
    <text x="790" y="846" fill="#b9c6dc" font-family="Noto Sans CJK JP, sans-serif" font-size="21">カードを選んでデッキを編集</text>
  </g>

  <!-- AREA-004: バージョン情報 -->
  <text id="TXT-003" x="1850" y="1030" text-anchor="end" fill="#7f8ca6" font-family="Noto Sans CJK JP, sans-serif" font-size="18">Version 1.0.0</text>

  <!-- ワイヤーフレーム注釈 -->
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="17">
    <rect x="1350" y="428" width="142" height="34" rx="8" fill="#080d16" opacity="0.92"/>
    <text x="1421" y="451" text-anchor="middle" fill="#dbe4f5">BTN-003</text>
    <line x1="1350" y1="445" x2="1310" y2="460" stroke="#dbe4f5" stroke-width="2"/>
    <rect x="1350" y="598" width="142" height="34" rx="8" fill="#080d16" opacity="0.92"/>
    <text x="1421" y="621" text-anchor="middle" fill="#dbe4f5">BTN-001</text>
    <line x1="1350" y1="615" x2="1310" y2="630" stroke="#dbe4f5" stroke-width="2"/>
    <rect x="1350" y="772" width="142" height="34" rx="8" fill="#080d16" opacity="0.92"/>
    <text x="1421" y="795" text-anchor="middle" fill="#dbe4f5">BTN-002</text>
    <line x1="1350" y1="789" x2="1310" y2="804" stroke="#dbe4f5" stroke-width="2"/>
  </g>
</svg>
